name: Build and Test Pull Requests

on:
  pull_request:
    branches:
    - main

jobs:
  build:
    name: "Build and Test Pull Requests"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Restore Nuget Packages
      run: dotnet restore CallbackHandler.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build CallbackHandler.sln --configuration Release

    - name: Run Unit Tests
      run: |
        echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
        dotnet test "CallbackHandler.BusinessLogic.Tests/CallbackHandler.BusinessLogic.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx
        dotnet test "CallbackHandler.CallbackMessageAggregate.Tests/CallbackHandler.CallbackMessageAggregate.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx
        dotnet test "CallbackHandler.Tests/CallbackHandler.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx

    - name: Build Docker Image
      run: docker build . --file CallbackHandler/Dockerfile --tag callbackhandler:latest

    - name: Run Integration Tests
      run: dotnet test "CallbackHandler.IntegrationTests/CallbackHandler.IntegrationTests.csproj" --configuration Release --no-build --verbosity normal --results-directory "${{ github.workspace }}/TestResults" --settings "CallbackHandler.IntegrationTests/Integration.runsettings"

    - uses: actions/upload-artifact@v4.4.0
      with:
        name: tracelogs
        path: /home/runner/trace/ 

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
          name: Unit Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 30 

    - name: Publish integration test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
          name: Integration Test Results
          path: 'TestResults/CallbackHandler.IntegrationTests.xml'
          reporter: dotnet-nunit
          fail-on-error: true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
          name: integration-test-results
          path: 'TestResults/CallbackHandler.IntegrationTests.xml'
          retention-days: 30

